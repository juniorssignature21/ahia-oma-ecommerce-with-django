{% extends "./base.html" %}
{% load static %}
{% block content %}
<div class="main-panel">
    <div class="content">
        <div class="container-fluid">
            <h4 class="page-title">
                Update Profile
            </h4>

            {% if messages %}
            {% for message in messages %}
            <div
                class="alert alert-primary alert-dismissible fade show"
                role="alert"
            >
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close"
                ></button>
                 {{message}}
            </div>
            
            <script>
                var alertList = document.querySelectorAll(".alert");
                alertList.forEach(function (alert) {
                    new bootstrap.Alert(alert);
                });
            </script>
            
            {% endfor  %}
            {% endif %}

            <div class="row">
                <div class="col-md-6">
                        <form action="{% url "customer:change_password" %}" method="post" enctype="multipart/form-data">
                            {% csrf_token %}
                        <div class="card">
                            
                            <div class="card-body">
                               
                               
                                <div class="form-group">
                                    <label for="inlineinput">Old Password:</label>
                                        <input type="password" class="form-control input-full" id="inlineinput" placeholder="Enter Input" name="old_password" placeholder="**********">
                                </div>                             
                                <div class="form-group">
                                    <label for="inlineinput">New Password:</label>
                                        <input type="password" class="form-control input-full" id="inlineinput" placeholder="Enter Input" name="new_password" placeholder="**********">
                                </div>                             
                                <div class="form-group">
                                    <label for="inlineinput">Confirm New Password:</label>
                                        <input type="password" class="form-control input-full" id="inlineinput" placeholder="Enter Input" name="confirm_new_password" placeholder="**********">
                                </div>                             
                               
                                										
                            </div>
                            <div class="card-action">
                                <button type="submit" class="btn btn-primary">
                                    Save <i class="la la-folder"></i>
                                </button>
                                <button class="btn btn-danger">
                                    Change Password
                                </button>
                            </div>
                        </div>
                    </form>
                    </div>
                </div>
            </div>
        </div>
       
    </div>

{% endblock content %}
